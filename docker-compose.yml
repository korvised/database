name: "databases"

services:
  mysql:
    container_name: Mysql
    image: mysql:8.0.35
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: zuzkpszw_web_bkia
      MYSQL_USER: zuzkpszw_root
      MYSQL_PASSWORD: Bkia@2223
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql/:/var/lib/mysql
    command:
      --default-authentication-plugin=mysql_native_password
  postgres:
    container_name: Postgres
    image: postgres:16.2
    restart: always
    environment:
      POSTGRES_USER: bkia
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      TZ: Asia/Vientiane
      PGTZ: Asia/Vientiane
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres/:/var/lib/postgresql/data/

  redis:
    container_name: Redis
    image: redis:6.2-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
